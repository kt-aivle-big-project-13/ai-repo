services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin-audit-ai
    env_file: .env
    environment:
      # glibc는 스레드마다 별도 arena를 만들고 해제된 메모리를 OS에 돌려주지 않고 쥐고 있는다.
      # FastAPI가 sync 라우터를 스레드풀에서 돌리는 데다 pandas·numpy가 큰 블록을 반복
      # 할당하는 워크로드라, 요청이 끝나도 상주 메모리가 기준선(158MiB)의 8배인 약 1.3GiB로
      # 남았다. arena 수를 제한해 그 파편화를 줄인다.
      MALLOC_ARENA_MAX: "2"
      # numpy·scipy가 쓰는 BLAS의 스레드 수. 지정하지 않으면 라이브러리마다 가용 코어를
      # 전부 잡으려 하고, 그런 요청이 동시에 여러 개면 2코어에 스레드가 수십 개 올라가
      # 경합만 커진다. XGBoost 쪽은 코드에서 nthread로 따로 고정한다
      # (app/services/model_loading.py).
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    ports:
      - "8000:8000"
    # 한도가 없으면 메모리가 부족할 때 커널 OOM Killer가 호스트 전체에서 대상을 고른다.
    # 실제로 t3.small에서 8번 이렇게 죽었는데, 컨테이너 cgroup 한도를 넘긴 게 아니라
    # 호스트가 고갈된 것이라 docker inspect의 OOMKilled가 false로 나와 원인 추적에
    # dmesg가 필요했다. 한도를 걸면 컨테이너만 죽으면서 OOMKilled로 바로 잡힌다.
    # 8GiB 인스턴스에서 OS·dockerd 몫을 남긴 값이다(관측된 피크는 약 1.4GiB).
    mem_limit: 6g
    restart: unless-stopped

  # 인스턴스 자원 메트릭 수집. AI 서버가 메모리 고갈로 8회 강제 종료되는 동안 아무도
  # 인지하지 못했고, 원인 파악도 dmesg와 docker stats를 손으로 찍어 추정해야 했다.
  # 모니터링 인스턴스가 백엔드와 같은 방식(EC2 서비스 디스커버리, 9100)으로 스크랩한다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: fin-audit-ai-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
    # 호스트 네임스페이스를 그대로 쓴다(node-exporter 권장 구성).
    #   network_mode: 컨테이너 네트워크가 아닌 호스트의 인터페이스·소켓 통계를 읽는다.
    #     9100이 호스트에 직접 열리므로 별도 포트 매핑이 필요 없다. 노출 범위는
    #     포트 매핑을 쓸 때와 같고, 접근 제어는 보안그룹(모니터링 SG만 허용)으로 한다.
    #   pid: 프로세스 메트릭이 컨테이너 안이 아니라 호스트 기준으로 잡힌다.
    #     OOM으로 죽는 게 어느 프로세스인지 보려면 호스트 기준이어야 한다.
    #   rslave: 컨테이너가 뜬 뒤 호스트에 생긴 마운트도 따라 보인다. 없으면 그 시점
    #     스냅샷에 머물러 파일시스템 메트릭이 실제와 어긋난다.
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    restart: unless-stopped
